<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SXVV Chat Generator</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0b0f">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0a0b0f;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* --- LANDING SCREEN --- */
    #landingScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      width: 100%;
      max-width: 400px;
    }

    #landingScreen img {
      width: 100px;
      height: 100px;
      border-radius: 18px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(255, 177, 94, 0.3);
    }

    #landingScreen h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 25px;
      background: linear-gradient(135deg, #fff, #ffb15e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn-main {
      background: #ffb15e;
      color: #0a0b0f;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
      box-shadow: 0 4px 12px rgba(255, 177, 94, 0.2);
    }

    .btn-main:active {
      transform: scale(0.96);
      background: #e69d4e;
    }

    /* --- MAIN GENERATOR APP --- */
    #mainApp {
      display: none; /* Disembunyikan saat di Landing Screen */
      flex-direction: column;
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      background: #121318;
      border-left: 1px solid #1f222e;
      border-right: 1px solid #1f222e;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 20px;
      background: #1a1c23;
      border-bottom: 1px solid #282b36;
    }

    .app-header h2 {
      font-size: 18px;
      color: #ffb15e;
    }

    .btn-back {
      background: transparent;
      border: 1px solid #ffb15e;
      color: #ffb15e;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }

    /* Area Chat Preview */
    .chat-preview {
      flex: 1;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #0a0b0f;
      min-height: 320px;
      max-height: 450px;
      overflow-y: auto;
      border-bottom: 1px solid #282b36;
    }

    .chat-bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.4;
      position: relative;
      word-break: break-word;
    }

    .chat-bubble.left {
      align-self: flex-start;
      background: #262933;
      color: #fff;
      border-bottom-left-radius: 4px;
    }

    .chat-bubble.right {
      align-self: flex-end;
      background: #ffb15e;
      color: #0a0b0f;
      font-weight: 500;
      border-bottom-right-radius: 4px;
    }

    .chat-time {
      font-size: 10px;
      opacity: 0.6;
      margin-top: 4px;
      text-align: right;
    }

    /* Area Control Input */
    .app-controls {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #121318;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 12px;
      color: #a0a5b5;
    }

    .input-group input, .input-group select {
      background: #1a1c23;
      border: 1px solid #282b36;
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    .input-group input:focus {
      border-color: #ffb15e;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 5px;
    }

    .btn-action {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-add {
      background: #ffb15e;
      color: #0a0b0f;
    }

    .btn-clear {
      background: #262933;
      color: #ff5555;
      border: 1px solid #ff5555;
    }
  </style>
</head>
<body>

  <!-- 1. LANDING SCREEN -->
  <div id="landingScreen">
    <img src="icon.png" alt="Logo SV">
    <h1>Welcome To SXVV Chat Generator</h1>
    <button class="btn-main" onclick="openGenerator()">Masuk ke Generator</button>
  </div>

  <!-- 2. MAIN GENERATOR APP -->
  <div id="mainApp">
    <div class="app-header">
      <h2>SXVV Generator</h2>
      <button class="btn-back" onclick="closeGenerator()">Kembali</button>
    </div>

    <!-- Tampilan Obrolan -->
    <div class="chat-preview" id="chatBox">
      <div class="chat-bubble left">
        Halo! Selamat datang di SXVV Chat Generator.
        <div class="chat-time">12:00</div>
      </div>
    </div>

    <!-- Form Kontrol Pesan -->
    <div class="app-controls">
      <div class="input-group">
        <label for="senderType">Tipe Pengirim</label>
        <select id="senderType">
          <option value="right">Saya (Kanan - Oranye)</option>
          <option value="left">Teman (Kiri - Abu-abu)</option>
        </select>
      </div>

      <div class="input-group">
        <label for="messageInput">Pesan Chat</label>
        <input type="text" id="messageInput" placeholder="Ketik pesan di sini...">
      </div>

      <div class="input-group">
        <label for="timeInput">Waktu (Jam:Menit)</label>
        <input type="text" id="timeInput" placeholder="Contoh: 19:30">
      </div>

      <div class="btn-group">
        <button class="btn-action btn-add" onclick="addMessage()">Kirim Pesan</button>
        <button class="btn-action btn-clear" onclick="clearChat()">Hapus Semua</button>
      </div>
    </div>
  </div>

  <!-- 3. JAVASCRIPT LOGIC -->
  <script>
    // Fungsi Pindah Halaman
    function openGenerator() {
      document.getElementById('landingScreen').style.display = 'none';
      document.getElementById('mainApp').style.display = 'flex';
    }

    function closeGenerator() {
      document.getElementById('mainApp').style.display = 'none';
      document.getElementById('landingScreen').style.display = 'flex';
    }

    // Fungsi Tambah Pesan ke Chat Preview
    function addMessage() {
      const msgInput = document.getElementById('messageInput');
      const timeInput = document.getElementById('timeInput');
      const senderType = document.getElementById('senderType').value;
      const chatBox = document.getElementById('chatBox');

      const text = msgInput.value.trim();
      if (!text) return;

      // Ambil waktu saat ini jika input waktu kosong
      const now = new Date();
      const defaultTime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      const time = timeInput.value.trim() || defaultTime;

      // Buat gelembung chat baru
      const bubble = document.createElement('div');
      bubble.className = `chat-bubble ${senderType}`;
      bubble.innerHTML = `
        ${escapeHTML(text)}
        <div class="chat-time">${escapeHTML(time)}</div>
      `;

      chatBox.appendChild(bubble);
      chatBox.scrollTop = chatBox.scrollHeight;

      // Reset input teks
      msgInput.value = '';
    }

    // Fungsi Hapus Semua Chat
    function clearChat() {
      if (confirm('Hapus semua obrolan?')) {
        document.getElementById('chatBox').innerHTML = '';
      }
    }

    // Pengaman Karakter Teks
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }
  </script>
</body>
</html>
